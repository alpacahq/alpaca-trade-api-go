name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x, 1.27.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Test
        run: go test -cover -timeout 6s ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # golangci-lint v1.64.8 supports up to Go 1.24; 1.25+ needs golangci-lint v2 + config migration
          go-version: 1.24
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - name: Build
        run: go build -v ./...
      - name: Make sure the generated files are up-to-date
        run: |
          make generate
          git diff --exit-code
